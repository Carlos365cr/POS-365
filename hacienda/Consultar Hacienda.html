<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS 365 · Consulta de comprobantes</title><style>
*{box-sizing:border-box}body{background:#f2f5ef;color:#183b32;font:17px/1.5 system-ui;margin:0}header{background:#173e32;color:white;padding:18px 6vw;letter-spacing:.15em;font-weight:750}main{max-width:810px;margin:7vh auto;padding:0 20px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.05em;line-height:1.1}section,form{background:white;padding:clamp(18px,4vw,32px);border:1px solid #cad7cd;border-radius:14px;margin:18px 0}label{display:block;font-weight:650}input,select,button{font:inherit;border:1px solid #9bada2;border-radius:7px;padding:10px;max-width:100%}input{width:100%;margin:6px 0 12px;font:16px monospace;padding:14px 9px}button{background:#196047;color:white;cursor:pointer}select{background:white;margin:6px 0 16px}dl{display:grid;grid-template-columns:auto 1fr;gap:10px 20px}dd{margin:0;overflow-wrap:anywhere;font-weight:600}h2{color:#166045;margin:0} @media(max-width:540px){dl{display:block}dd{margin-bottom:10px}}</style>
<header>POS 365</header><main><h1>Consulta de comprobantes</h1><p>Muestra local con dos respuestas ficticias de ejemplo.</p><form id="form"><label for="example">Elegir factura de ejemplo</label><select id="example"></select><label for="key">Clave electrónica</label><input id="key" inputmode="numeric" required pattern="[0-9]{50}" title="Ingresá los 50 dígitos de la clave"><button>Consultar</button></form><p id="notice" role="status"></p><section id="result" hidden><h2 id="state"></h2><dl id="details"></dl><button id="download">Descargar XML original</button></section></main>
<script>
const records=[{"Clave": "00000000000000000000000000000000000000000000000001", "Mensaje": "1", "NombreEmisor": "Proveedor de ejemplo 1", "NombreReceptor": "Cliente de ejemplo", "MontoTotalImpuesto": "13", "TotalFactura": "113", "xml": "PE1lbnNhamVIYWNpZW5kYT48Q2xhdmU+MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDE8L0NsYXZlPjxNZW5zYWplPjE8L01lbnNhamU+PE5vbWJyZUVtaXNvcj5Qcm92ZWVkb3IgZGUgZWplbXBsbyAxPC9Ob21icmVFbWlzb3I+PE5vbWJyZVJlY2VwdG9yPkNsaWVudGUgZGUgZWplbXBsbzwvTm9tYnJlUmVjZXB0b3I+PE1vbnRvVG90YWxJbXB1ZXN0bz4xMzwvTW9udG9Ub3RhbEltcHVlc3RvPjxUb3RhbEZhY3R1cmE+MTEzPC9Ub3RhbEZhY3R1cmE+PC9NZW5zYWplSGFjaWVuZGE+"}, {"Clave": "00000000000000000000000000000000000000000000000002", "Mensaje": "1", "NombreEmisor": "Proveedor de ejemplo 2", "NombreReceptor": "Cliente de ejemplo", "MontoTotalImpuesto": "13", "TotalFactura": "113", "xml": "PE1lbnNhamVIYWNpZW5kYT48Q2xhdmU+MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDI8L0NsYXZlPjxNZW5zYWplPjE8L01lbnNhamU+PE5vbWJyZUVtaXNvcj5Qcm92ZWVkb3IgZGUgZWplbXBsbyAyPC9Ob21icmVFbWlzb3I+PE5vbWJyZVJlY2VwdG9yPkNsaWVudGUgZGUgZWplbXBsbzwvTm9tYnJlUmVjZXB0b3I+PE1vbnRvVG90YWxJbXB1ZXN0bz4xMzwvTW9udG9Ub3RhbEltcHVlc3RvPjxUb3RhbEZhY3R1cmE+MTEzPC9Ub3RhbEZhY3R1cmE+PC9NZW5zYWplSGFjaWVuZGE+"}];
const el=id=>document.getElementById(id);
const key=el('key'),example=el('example'),result=el('result');
for(const r of records)example.add(new Option(r.NombreEmisor,r.Clave));
function clearResult(){result.hidden=true;el('notice').textContent=''}
example.onchange=()=>{key.value=example.value;clearResult()};example.onchange();key.oninput=clearResult;
el('form').onsubmit=e=>{
 e.preventDefault();clearResult();const r=records.find(x=>x.Clave===key.value);
 if(!r){el('notice').textContent='Esta clave no está entre las dos respuestas guardadas en la muestra.';return}
 const money=n=>new Intl.NumberFormat('es-CR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n));
 el('state').textContent=r.Mensaje==='1'?'Aceptado':'Mensaje '+r.Mensaje;
 const details=el('details');details.replaceChildren();
 for(const [name,value] of [['Emisor',r.NombreEmisor],['Receptor',r.NombreReceptor],['Impuesto total',money(r.MontoTotalImpuesto)],['Total de la factura',money(r.TotalFactura)],['Clave',r.Clave]]){
 const term=document.createElement('dt'),data=document.createElement('dd');term.textContent=name;data.textContent=value;details.append(term,data)}
 el('download').onclick=()=>{const a=document.createElement('a');a.href='data:application/xml;base64,'+r.xml;a.download='Respuesta-MH-'+r.Clave+'.xml';a.click()};
 result.hidden=false;el('notice').textContent='Respuesta encontrada en el archivo local.';
};
</script></html>
