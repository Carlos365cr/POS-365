<!DOCTYPE html><html lang="es"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Cargas XML</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#1e372e;font:15px -apple-system,sans-serif}header,main{padding:18px 28px}header{background:#164933;color:white}h1{margin:0;font-size:24px}section{background:white;padding:18px;border-radius:9px;margin-bottom:14px}label{display:inline-grid;gap:5px;font-size:13px}input,select,button{font:inherit;padding:7px;border:1px solid #acbeb2;border-radius:5px}button{cursor:pointer;background:#176345;color:white}form,.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;text-align:left;border-bottom:1px solid #ddd}th{position:sticky;top:0;background:#eaf2ed}.scroll{max-height:38vh;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}dialog{max-height:85vh;width:min(90vw,1000px);border:1px solid #899;border-radius:10px}p{white-space:pre-line}#password{width:150px}</style>
<header><h1>Cargas XML</h1></header><main><section><form id="form"><label>Correo<input id="email" type="email" value="operador@example.com" required></label><label>Clave de aplicación<input id="password" type="password" autocomplete="off" required></label><label>Desde<input type="date" id="start" required></label><label>Hasta<input type="date" id="end" required></label><button>Cargar desde Gmail</button></form><p role="status" id="status"></p><button id="imp">Importar XML de la Mac</button></section>
<section><div class="controls"><label>Consultar<select id="view"><option>Documentos</option><option>Productos</option><option>Avisos de Hacienda</option></select></label><label>Buscar<input type="search" id="query" placeholder="Producto, código, emisor o clave"></label><label>Estado<select id="state"><option value="">Todos</option><option>Aceptado</option><option>Aceptado parcialmente</option><option>Rechazado</option><option>Sin respuesta</option></select></label></div><p id="count"></p><div class="scroll"><table><thead></thead><tbody></tbody></table></div><button id="prev">Anterior</button> <button id="next">Siguiente</button></section></main>
<dialog id="detail"><button onclick="this.parentNode.close()">Cerrar</button><pre id="content"></pre><button id="original">Ver XML original</button></dialog>
<script>
const $=id=>document.getElementById(id), bridge=window.webkit.messageHandlers.cedi;
let docs=[],byKey=new Map(),page=0,pending,selected,busy=false;
function call(mode,args={}){if(busy)return;busy=true;pending=mode;document.querySelectorAll('button').forEach(b=>b.disabled=true);bridge.postMessage({mode,...args})}
function finish(r){busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(!r.ok){$('status').textContent=r.error;return}if(pending==='original'){$('content').textContent=r.value;return}if(pending==='list'){docs=r.value;byKey=new Map();for(const d of docs)if(d.tipo==='MensajeHacienda'&&!byKey.has(d.clave))byKey.set(d.clave,d);render();return}$('status').textContent=r.value;call('list')}
function openDoc(d){selected=d;const h=byKey.get(d.clave);$('content').textContent=[d.tipo,d.fecha,d.clave,d.emisor,d.receptor,'Total '+d.total,'Hacienda · '+(h?.estado||'Sin respuesta'),h?.aviso,...d.lineas.map(l=>l.join(' · ')),...d.enlaces].filter(Boolean).join('\n');$('detail').showModal()}
function render(){const products=$('view').value==='Productos',alerts=$('view').value==='Avisos de Hacienda',needle=$('query').value.toLocaleLowerCase().trim(),filter=$('state').value;
const rows=[];for(const d of docs){if(alerts&&d.tipo!=='MensajeHacienda')continue;const state=(d.estado||byKey.get(d.clave)?.estado||'Sin respuesta');if(filter&&state!==filter)continue;
const lines=products?d.lineas.map(l=>[l[2],l[0]||l[1],l[3],l[4],l[5],d.emisor]):[[d.fecha.slice(0,10),d.tipo,d.emisor,d.total,state]];
for(const l of lines)if([...l,d.clave,d.receptor,alerts?d.aviso:''].join(' ').toLocaleLowerCase().includes(needle))rows.push([l,d])}
const head=document.querySelector('thead'),body=document.querySelector('tbody');head.replaceChildren();body.replaceChildren();const header=head.insertRow();for(const name of [...(products?['Producto','Código','Cantidad','Precio','Total','Emisor']:['Fecha','Documento','Emisor','Total','Hacienda']),'']){let th=document.createElement('th');th.textContent=name;header.append(th)}
page=Math.max(0,Math.min(page,Math.ceil(rows.length/50)-1));for(const [l,d] of rows.slice(page*50,page*50+50)){const tr=body.insertRow();for(const v of l)tr.insertCell().textContent=v;let b=document.createElement('button');b.textContent='Ver';b.onclick=()=>openDoc(d);tr.insertCell().append(b)}
$('count').textContent=rows.length+' resultados · Página '+(page+1);$('prev').disabled=page===0;$('next').disabled=(page+1)*50>=rows.length}
$('form').onsubmit=e=>{e.preventDefault();if(busy)return;if($('end').value<$('start').value){$('status').textContent='Revisá las fechas.';return}const password=$('password').value;$('password').value='';$('status').textContent='Consultando Gmail y guardando XML…';call('download',{email:$('email').value,password,start:$('start').value,end:$('end').value})};
$('imp').onclick=()=>call('import');$('original').onclick=()=>call('original',{id:selected.id});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};for(const id of ['view','state','query'])$(id).oninput=()=>{page=0;render()};let today=new Date();let date=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');$('end').value=date;$('start').value=date.slice(0,8)+'01';call('list')
</script></html>
