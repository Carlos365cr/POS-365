<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS365 · Caja SQL de desarrollo</title><style>body{font:16px system-ui;background:#eef3f8;color:#19304a;max-width:950px;margin:auto;padding:24px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{background:white;padding:20px;border-radius:12px}input,select,button{font:inherit;padding:10px;max-width:100%;margin:4px}input{width:90%}button{background:#12598f;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{background:#999}li{margin:12px 0}table{width:100%}th,td{border-bottom:1px solid #ddd;text-align:left;padding:5px}.alert{background:#fff1d0;padding:12px}@media(max-width:750px){main{grid-template-columns:1fr}}</style></head><body><a href="/">Inicio</a><h1>POS365 · Caja SQL de desarrollo</h1><p class="alert">Solo pruebas: catálogo y precios desde SQL Server. El detalle es temporal: NO se guardan ventas, pagos ni inventario.</p><main><section><h2>Consultar artículos</h2><label>Código o barras <input id="code" autofocus autocomplete="off"></label><button id="lookup">Consultar (Enter)</button><p><label>Lista de precios <select id="list"></select></label></p><label>Buscar por nombre <input id="name" autocomplete="off"></label><button id="search">Buscar</button><p id="status" role="status"></p><ul id="results"></ul></section><section><h2>Detalle provisional</h2><table><thead><tr><th>Artículo</th><th>Cant.</th><th>Precio</th><th></th></tr></thead><tbody id="lines"></tbody></table><p>Total de prueba: <strong id="total">0</strong></p><button id="clear">Limpiar</button><button disabled>Facturar (pendiente)</button></section></main><script>
'use strict';const $=id=>document.getElementById(id);const lines=[];const fmt=n=>new Intl.NumberFormat('es-CR',{minimumFractionDigits:2,maximumFractionDigits:4}).format(n);
for(let i=0;i<100;i++){const x=document.createElement('option');x.value=i;x.textContent='Lista '+i;$('list').append(x)}
const status=s=>$('status').textContent=s;
async function get(path){const r=await fetch(path,{cache:'no-store'}),data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Error HTTP '+r.status);return data}
async function product(code){return get('/api/pos/product?'+new URLSearchParams({code,list:$('list').value}))}
function add(p){if(p.price==null||!Number.isFinite(Number(p.price))){status('Artículo sin precio válido para la lista.');return}if(lines.length&&lines[0].currency!==p.currency){status('No se pueden mezclar monedas.');return}const old=lines.find(x=>x.id===p.id);if(old)old.qty++;else lines.push({...p,qty:1});draw();status('Artículo agregado temporalmente.');$('code').value='';$('code').focus()}
function draw(){const body=$('lines');body.replaceChildren();for(const p of lines){const row=document.createElement('tr');const td=(value)=>{const e=document.createElement('td');e.textContent=value;row.append(e);return e};td(p.name+' / '+p.code);const q=td('');const input=document.createElement('input');input.type='number';input.min='1';input.max='99999';input.step='1';input.value=p.qty;input.style.width='60px';input.onchange=()=>{const v=Number(input.value);if(Number.isSafeInteger(v)&&v>0&&v<=99999)p.qty=v;draw()};q.append(input);td(fmt(Number(p.price)));const cell=td('');const remove=document.createElement('button');remove.textContent='Eliminar';remove.onclick=()=>{lines.splice(lines.indexOf(p),1);draw()};cell.append(remove);body.append(row)}$('total').textContent=(lines[0]?.currency||'CRC')+' '+fmt(lines.reduce((s,p)=>s+p.qty*Number(p.price),0))}
async function lookup(){const code=$('code').value.trim();if(!code)return status('Ingrese código.');try{status('Consultando SQL...');add(await product(code))}catch(e){status(e.message)}}
async function search(){const q=$('name').value.trim();if(!q)return status('Ingrese descripción.');try{const data=await get('/api/catalog/products?'+new URLSearchParams({q,page:1}));$('results').replaceChildren();for(const p of data.items){const li=document.createElement('li'),btn=document.createElement('button'),label=document.createElement('span');label.textContent=p.code+' · '+p.name+' ';btn.textContent='Agregar';btn.onclick=async()=>{try{add(await product(p.code))}catch(e){status(e.message)}};li.append(label,btn);$('results').append(li)}status(data.items.length+' coincidencias.'+(data.hasMore?' Refine búsqueda para más.':''))}catch(e){status(e.message)}}
$('lookup').onclick=lookup;$('code').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();lookup()}};$('search').onclick=search;$('name').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('clear').onclick=()=>{lines.length=0;draw()};$('list').onchange=()=>{lines.length=0;draw();status('Cambio de lista: detalle reiniciado para evitar precios desactualizados.')};draw();
</script></body></html>
