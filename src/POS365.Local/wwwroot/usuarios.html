<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POS365 | Usuarios</title>
<style>
:root{font:15px system-ui,Arial;color:#17342b;background:#eff4f0}*{box-sizing:border-box}body{margin:0}
header{background:#123d30;color:#fff;padding:18px max(22px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}
header h1{font-size:22px;margin:0}a{color:inherit}main{max-width:1080px;margin:26px auto;padding:0 18px}
section{background:#fff;border:1px solid #d7e1d9;border-radius:12px;padding:20px;margin-bottom:20px}
h2{font-size:18px;margin:0 0 12px}label{display:block;font-weight:600;font-size:13px}
input{width:100%;padding:10px;border:1px solid #b6c9bd;border-radius:7px;font:inherit;margin-top:5px}
input[type=checkbox]{width:auto;margin-right:8px}button{padding:10px 14px;background:#165840;color:#fff;border:0;border-radius:7px;font:inherit;cursor:pointer}button.secondary{background:#e4ede7;color:#173c30}
button:disabled{opacity:.6;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;align-items:end}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:11px;border-bottom:1px solid #e6ece7;text-align:left}th{background:#f4f8f4}
tr.selected{background:#e5f1e8}tr button{padding:6px 10px}#status{min-height:1.4em;font-weight:600}
.checks{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding-top:12px}
</style></head><body>
<header><h1>POS365 · Administración de usuarios</h1><a href="/">Volver al POS</a></header>
<main>
<section><h2 id="heading">Crear usuario</h2>
<form id="userForm">
<div class="grid">
<label>Usuario<input id="username" maxlength="64" minlength="3" pattern="[A-Za-z0-9._-]{3,64}" required autocomplete="off"></label>
<label>Nombre completo<input id="displayName" maxlength="150" required></label>
<label id="passwordLabel">Contraseña inicial<input id="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
</div>
<div class="checks"><label><input id="isAdmin" type="checkbox">Administrador</label><label><input id="isActive" type="checkbox" checked>Activo</label></div>
<div class="actions"><button id="save" type="submit">Crear usuario</button><button id="cancel" class="secondary" type="button">Nuevo / cancelar edición</button>
<button id="resetPassword" class="secondary" type="button" hidden>Cambiar contraseña</button><button id="unlock" class="secondary" type="button" hidden>Desbloquear</button></div>
</form><p id="status" role="status" aria-live="polite"></p></section>
<section><h2>Usuarios registrados</h2><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Perfil</th><th>Estado</th><th>Bloqueo</th><th>Acción</th></tr></thead><tbody id="list"></tbody></table></div></section>
</main><script>
const $=id=>document.getElementById(id);
let users=[],current=null,busy=false;
async function request(url,method='GET',body){
 const options={method,credentials:'same-origin',cache:'no-store'};
 if(body!==undefined){options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(body);}
 const res=await fetch(url,options);let data={};try{data=await res.json();}catch{}
 if(res.status===401){location.replace('/login');throw Error('La sesión terminó.');}
 if(res.status===403)throw Error('Se requiere perfil administrador.');
 if(!res.ok)throw Error(data.error||'Error HTTP '+res.status);
 return data;
}
function message(t){$('status').textContent=t;}
function clear(){
 current=null;$('userForm').reset();$('isActive').checked=true;$('username').disabled=false;
 $('password').required=true;$('passwordLabel').hidden=false;$('heading').textContent='Crear usuario';
 $('save').textContent='Crear usuario';$('resetPassword').hidden=true;$('unlock').hidden=true;
 render();
}
function select(u){
 current=u.userId;$('username').value=u.username;$('username').disabled=true;
 $('displayName').value=u.displayName;$('password').value='';$('password').required=false;
 $('passwordLabel').hidden=true;$('isAdmin').checked=u.isAdmin;$('isActive').checked=u.isActive;
 $('heading').textContent='Modificar usuario';$('save').textContent='Guardar cambios';
 $('resetPassword').hidden=false;$('unlock').hidden=false;message('Editando '+u.username);
 render();
}
function render(){
 const tbody=$('list');tbody.replaceChildren();
 for(const u of users){
  const tr=document.createElement('tr');if(current===u.userId)tr.className='selected';
  for(const value of [u.username,u.displayName,u.isAdmin?'Administrador':'Usuario',u.isActive?'Activo':'Inactivo',u.lockedUntil?'Bloqueado hasta '+new Date(u.lockedUntil+'Z').toLocaleString('es-CR'):'Sin bloqueo']){
   const td=document.createElement('td');td.textContent=value;tr.append(td);
  }
  const td=document.createElement('td'),b=document.createElement('button');b.textContent='Modificar';b.className='secondary';b.onclick=()=>select(u);td.append(b);tr.append(td);tbody.append(tr);
 }
}
async function refresh(){
 users=await request('/api/auth/users');render();
}
async function run(task){
 if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{await task();await refresh();}
 catch(e){message(e.message);}
 finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}
$('cancel').onclick=()=>{clear();message('');};
$('userForm').onsubmit=e=>{e.preventDefault();run(async()=>{
 const data={displayName:$('displayName').value.trim(),isAdmin:$('isAdmin').checked,isActive:$('isActive').checked};
 if(current){
  await request('/api/auth/users/'+encodeURIComponent(current),'PUT',data);
  message('Usuario actualizado correctamente.');clear();
 }else{
  await request('/api/auth/users','POST',{username:$('username').value.trim(),displayName:data.displayName,password:$('password').value,isAdmin:data.isAdmin});
  message('Usuario creado correctamente.');clear();
 }
});};
$('resetPassword').onclick=()=>{if(!current)return;const pass=prompt('Nueva contraseña (mínimo 12 caracteres):');if(pass===null)return;
 if(pass.length<12){message('La contraseña debe tener al menos 12 caracteres.');return;}
 if(!confirm('¿Confirmar cambio de contraseña?'))return;
 run(async()=>{await request('/api/auth/users/'+encodeURIComponent(current)+'/password','POST',{password:pass});message('Contraseña actualizada.');});
};
$('unlock').onclick=()=>{if(!current)return;run(async()=>{await request('/api/auth/users/'+encodeURIComponent(current)+'/unlock','POST',{});message('Usuario desbloqueado.');});};
request('/api/auth/me').then(u=>{if(!u.admin)throw Error('Se requiere perfil administrador.');return refresh();}).catch(e=>message(e.message));
</script></body></html>
