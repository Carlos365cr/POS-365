<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POS365 | Cargas XML SQL</title><style>body{font:15px system-ui;margin:24px;color:#172333}button,input{font:inherit;padding:8px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}#status{white-space:pre-wrap}a{color:#176b8b}</style><a href="/pos-original.html">← Volver a POS365</a><h1>Cargas XML — recepción SQL</h1><p>Reciba comprobantes del correo configurado en el servidor. Los documentos quedan pendientes de registro; no se modifica inventario.</p><form id="search"><label>Desde <input type="date" id="from" required></label> <label>Hasta <input type="date" id="to" required></label> <button>Buscar en correo</button></form><p id="status" role="status"></p><button id="refresh">Actualizar lista</button><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Proveedor</th><th>Tipo</th><th>Clave</th><th>Total</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></div><script>
const by=id=>document.getElementById(id),status=by('status');
const today=new Date(Date.now()-21600000).toISOString().slice(0,10);by('from').value=today;by('to').value=today;
async function request(path,options){const r=await fetch('/api/purchases/inbox/'+path,options);const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||data.detail||('HTTP '+r.status));return data;}
async function load(){const data=await request('');const rows=by('rows');rows.replaceChildren();for(const item of data){const tr=document.createElement('tr');for(const value of [item.date,item.supplier,item.type,item.key,item.currency+' '+item.total,item.status]){const td=document.createElement('td');td.textContent=value;tr.append(td);}rows.append(tr);}}
by('refresh').onclick=()=>load().catch(e=>status.textContent=e.message);
by('search').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;let offset=0,total=0,duplicates=0,errors=0,ignored=0;try{for(let i=0;i<100;i++){status.textContent='Consultando correo… '+offset+' mensajes revisados';const data=await request('search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:by('from').value,to:by('to').value,offset})});total+=data.inserted;duplicates+=data.duplicate;errors+=data.errors;ignored+=data.ignored;offset=data.nextOffset;status.textContent='Nuevos: '+total+' | Duplicados: '+duplicates+' | Ignorados: '+ignored+' | Errores: '+errors+' | Pendientes de revisar: '+data.remaining;if(!data.remaining||!data.processed)break;}await load();}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
load().catch(e=>status.textContent=e.message);
</script></html>
